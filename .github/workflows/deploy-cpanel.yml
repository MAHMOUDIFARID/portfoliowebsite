name: Deploy portfolio to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt an upload halfway through or overlap production deployments.
concurrency:
  group: cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install test and deployment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp php-cli

      - run: npm ci

      - name: Test contact endpoint and deployment preservation
        run: |
          npm run test:contact
          python3 tests/contact_http.py
          python3 tests/deploy_cpanel.py

      - name: Build portfolio
        run: |
          npm run build:portfolio
          test -s dist/index.html
          test -s dist/api/contact.php
          test -s dist/.htaccess

      - name: Check deployment credentials
        id: credentials
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [[ -n "$FTP_SERVER" && -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Build verified, deployment skipped. Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD repository secrets, then run this workflow again.'
            echo '### Build verified; deployment pending FTP secrets' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy over explicit FTPS (port 21)
        if: steps.credentials.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # A hostname only: no URL, path, or inline credentials.
          [[ "$FTP_SERVER" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          lftp --norc --user "$FTP_USERNAME" --env-password -p 21 \
            "ftp://$FTP_SERVER" -e 'source scripts/deploy-cpanel.lftp; bye'
          echo '### Portfolio deployed to https://mahmoudi.ma' >> "$GITHUB_STEP_SUMMARY"
